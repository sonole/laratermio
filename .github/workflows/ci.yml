name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The suite runs on in-memory sqlite; production is MySQL.
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip, exif, gd, pdo_sqlite
          coverage: none

      - name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: cp .env.example .env

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: php artisan key:generate

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # The home page uses @vite and public/build is not committed. The build also downloads the
      # Bunny font, so it needs network access.
      - run: npm ci
      - run: npm run build

      # composer test = lint:check + types:check + php artisan test, the same gate as local.
      - run: composer test
